# Not a distributable package — this table exists to pin the Python
# version the app is developed/tested against (backlog item). venv/ on
# the operator machine runs 3.13; match it when recreating the venv.
[project]
name = "video-studio"
version = "3.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Quiet plugin discovery noise; keep the report compact. Pytest's
# default basetemp lives under %TEMP% (C:\Users\…\AppData\Local\Temp)
# which sandboxed shells / antivirus on this machine sometimes deny
# enter access to. Pin it inside the repo's temp/ instead — same
# folder the renderer uses for its own intermediates.
addopts = "-q --tb=short --basetemp=temp/pytest"
